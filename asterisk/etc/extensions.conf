[globals]
AGATEPHONE=/var/lib/asterisk/sounds/agatephone
CONFESSION_RECORDING_PATH=/var/spool/asterisk/confessions
AGI_BASE_PATH=/var/lib/asterisk/agi-bin


[local]

exten => 512,1,Dial(SIP/ht503fxs,30)
exten => 512,n,Voicemail(512,u)
exten => 512,n,Hangup()

exten => 256,1,Dial(IAX2/99,30)
exten => 256,n,Voicemail(256,u)
exten => 256,n,Hangup()

; Outbound calls to numbers starting with '1' and 10 digits
exten => _1NXXNXXXXXX,1,Dial(SIP/ht503fxo/${EXTEN},60)
exten => _1NXXNXXXXXX,n,Hangup()

; Voicemail access
exten => 8500,1,VoicemailMain()
exten => 8500,n,Hangup()



[from-pstn]
exten => s,1,NoOp(Incoming call from ${CALLERID(all)})
exten => s,n,Dial(SIP/ht503fxs,30)
exten => s,n,Voicemail(512,u)
exten => s,n,Hangup()



[test]

exten => 100,1,Answer()
same => n,Playback(hello)
same => n,Wait(1)
same => n,AGI(test_script.py,${UNIQUE_ID})
same => n,ExecIf($["${AGISTATUS}" = "FAILED"]?Playback(something-terribly-wrong)
same => n,Wait(1)
same => n,Hangup()


[agatephone]
; Accept dialing of any number and send to menu

exten => 256,1,Dial(IAX2/99)
exten => 512,1,Dial(IAX2/98)

exten => _XXX,1,Answer()
exten => _XXX,2,Goto(elysium_menu,s,1)

[elysium_menu]
exten => s,1,Background(${AGATEPHONE}/elysium_bell_welcome_nova_8000)
same =>  n,WaitExten()

; Menu options
exten => 1,1,Goto(test,100,1)
exten => 6,1,Goto(confession_menu,s,1)
exten => 9,1,Goto(horoscope_menu,s,1)

; Invalid input handling
exten => i,1,Playback(${AGATEPHONE}/elysium_bell_invalid_option_8000)
exten => i,2,Goto(elysium_menu,s,1)

[confession_menu]
; Confession menu processing
exten => s,1,Answer()
same => n,Wait(2)
same => n,Playback(/var/lib/asterisk/sounds/agatephone/confession_prompt_8000)  ; Play prompt asking for confession
same => n,Wait(2)
same => n,Record(/var/spool/asterisk/confessions/confession_${UNIQUEID}.wav,5,30)  ; Record the confession

same => n,Playback(/var/lib/asterisk/sounds/agatephone/confession_saved_8000)   ; Play "Confession saved" message

same => n,AGI(score_confession_in_background.py,${UNIQUEID})  ; Run AGI script in the background
same => n,MusicOnHold(monotron,15)  ; Play on-hold music while AGI script runs
same => n,Playback(/var/lib/asterisk/sounds/agatephone/confession_receipt_8000)  ; Play final message
same => n,Hangup()

[horoscope_menu]
; Horoscope menu processing
exten => s,1,Answer()
same => n,Wait(2)
same => n,Background(${AGATEPHONE}/horoscope_welcome)     ; Play a welcome message
same => n,WaitExten(10)                                      ; Wait for up to 10 seconds for input
same => n,Hangup()

exten => _XXXX,1,NoOp(Received birthdate: ${EXTEN})           ; Match any 4-digit input
same => n,Wait(2)
same => n,Playback(${AGATEPHONE}/horoscope_accepted)    ; Play a message confirming input
same => n,AGI(death_horoscope_agi.py, ${EXTEN})              ; Invoke AGI stub with deathdate
same => n,MusicOnHold(monotron,15)                           ; Play music while processing
same => n,StopMusicOnHold()                                  ; Stop music on hold
same => n,Playback(${AGATEPHONE}/horoscope_goodbye)     ; Play goodbye message
same => n,Hangup()

